<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATCHALO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: linear-gradient(135deg, #f5f7fa 0%, #e8e4f1 100%);
            --card: rgba(255, 255, 255, 0.85);
            --text: #4a0e69;
            --text-secondary: #8a6aa0;
            --accent: #6a11cb;
            --accent-light: rgba(106, 17, 203, 0.1);
            --accent-gradient: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            --glass-border: rgba(255, 255, 255, 0.2);
            --faint-border: rgba(0, 0, 0, 0.08);
            --grid-line-color: rgba(106, 17, 203, 0.1);
            --shadow-soft: 0 4px 15px rgba(106, 17, 203, 0.08);
            --shadow-medium: 0 8px 30px rgba(106, 17, 203, 0.1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            background: var(--bg);
            color: var(--text);
        }
        
        .glass-card {
            background: var(--card);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: var(--shadow-soft), 0 0 0 1px var(--glass-border), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: none !important;
        }

        .themed-button { font-weight: 600; border-radius: 12px; transition: all 0.3s var(--ease-smooth); border: none; }
        .themed-button.primary { background: var(--accent-gradient); }
        .themed-button.secondary { background-color: rgba(255,255,255,0.8); color: var(--text); border: 1px solid var(--faint-border); }
        .themed-button.tertiary { background: none; color: var(--text-secondary); }
        .themed-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-medium); }
        
        .progress-bar-container { background: var(--accent-light); }
        .progress-bar-fill { background: var(--accent-gradient); }

        .grid-cell.empty {
            box-shadow: inset 0 0 0 1px var(--grid-line-color);
        }

        hr { border-color: var(--faint-border); }
        
        .superpower-btn--active {
            background-color: var(--accent-light) !important;
            box-shadow: 0 0 0 2px var(--accent);
        }

        .pulsing-cell {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(106, 17, 203, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(106, 17, 203, 0); }
            100% { box-shadow: 0 0 0 0 rgba(106, 17, 203, 0); }
        }

        @keyframes dice-tumble {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(-180deg) scale(1.1); }
            100% { transform: rotate(-360deg) scale(1); }
        }
        .dice-tumble { animation: dice-tumble 0.6s var(--ease-bounce); }

        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="p-2 lg:p-4 flex items-center justify-center min-h-screen">
    <main id="game-container" class="w-full max-w-5xl mx-auto flex flex-col lg:flex-row gap-4 lg:gap-6 items-center lg:items-stretch">
        
        <div class="w-full lg:w-2/3">
            <div class="p-4 lg:p-6 h-full glass-card rounded-2xl">
                <div id="game-board" class="grid grid-cols-8 grid-rows-8 w-full aspect-square bg-white rounded-lg">
                    </div>
            </div>
        </div>

        <div class="w-full lg:w-1/3">
            <div class="h-full p-4 lg:p-6 glass-card rounded-2xl flex flex-col gap-y-3">
                
                <div class="p-4 rounded-2xl border" style="border-color: var(--faint-border); background: rgba(255,255,255,0.5);">
                    <div class="flex items-center gap-3">
                        <button id="roll-dice-btn" class="w-16 h-16 text-4xl flex items-center justify-center rounded-xl bg-white/80 border border-gray-200/50 shadow-sm transition-all duration-300 hover:scale-110 hover:shadow-lg focus:outline-none">🎲</button>
                        <div class="flex-1 grid grid-cols-2 gap-2">
                            <div id="dice-1" class="w-16 h-16 bg-white/60 rounded-lg flex items-center justify-center text-4xl text-gray-400 border border-gray-200/50 shadow-inner mx-auto">?</div>
                            <div id="dice-2" class="w-16 h-16 bg-white/60 rounded-lg flex items-center justify-center text-4xl text-gray-400 border border-gray-200/50 shadow-inner mx-auto">?</div>
                        </div>
                    </div>
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-center mt-4 mb-2" style="color: var(--text-secondary);">
                        Alo Superpowers <span id="sp-charge-1">✨</span><span id="sp-charge-2">✨</span>
                    </h3>
                    <div class="grid grid-cols-4 gap-1 text-center">
                        <button id="rotate-btn" class="superpower-btn themed-button tertiary text-xs p-1 relative">Rotate<div class="superpower-used-overlay hidden absolute inset-0 text-red-500 text-4xl font-extrabold flex items-center justify-center opacity-70">X</div></button>
                        <button id="swap-btn" class="superpower-btn themed-button tertiary text-xs p-1 relative">Swap<div class="superpower-used-overlay hidden absolute inset-0 text-red-500 text-4xl font-extrabold flex items-center justify-center opacity-70">X</div></button>
                        <button id="exchange-btn" class="superpower-btn themed-button tertiary text-xs p-1 relative">Exchange<div class="superpower-used-overlay hidden absolute inset-0 text-red-500 text-4xl font-extrabold flex items-center justify-center opacity-70">X</div></button>
                        <button id="move-btn" class="superpower-btn themed-button tertiary text-xs p-1 relative">Move<div class="superpower-used-overlay hidden absolute inset-0 text-red-500 text-4xl font-extrabold flex items-center justify-center opacity-70">X</div></button>
                    </div>
                </div>

                <div class="p-3 rounded-xl border" style="border-color: var(--faint-border); background: rgba(255,255,255,0.5);">
                    <div class="relative w-full h-2 progress-bar-container rounded-full">
                        <div id="progress-bar-fill" class="progress-bar-fill h-full rounded-full"></div>
                    </div>
                </div>

                <div class="p-4 rounded-2xl border" style="border-color: var(--faint-border); background: rgba(255,255,255,0.5);">
                    <div class="flex justify-center items-center gap-3">
                        <button class="themed-button secondary text-xs flex-1 py-2">Help</button>
                        <button id="reset-btn" class="themed-button primary text-xs flex-1 py-2 text-white">New Game</button>
                        <button class="themed-button secondary text-xs flex-1 py-2">Badges</button>
                    </div>
                    <div class="text-center mt-3">
                        <button class="themed-button tertiary w-full text-sm py-2">Edition: Circles</button>
                    </div>
                </div>
                
                <div class="p-4 rounded-2xl border flex-1" style="border-color: var(--faint-border); background: rgba(255,255,255,0.5);">
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div>
                            <h3 class="text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--text-secondary);">Total Score</h3>
                            <div id="total-score" class="text-3xl font-bold" style="color: var(--accent);">0</div>
                        </div>
                        <div>
                            <h3 class="text-xs font-semibold uppercase tracking-wider mb-1" style="color: var(--text-secondary);">High Score</h3>
                            <div id="high-score" class="text-3xl font-bold text-amber-500">0</div>
                        </div>
                    </div>
                    <hr class="border-t my-3">
                    <div class="grid grid-cols-3 gap-y-2 text-center">
                        <div class="score-item">
                            <h3 class="text-xs font-semibold uppercase tracking-wider" style="color: var(--text-secondary);">Circle</h3>
                            <div id="score-circle" class="text-lg font-bold">0</div>
                        </div>
                        <div class="score-item">
                            <h3 class="text-xs font-semibold uppercase tracking-wider" style="color: var(--text-secondary);">Semi Circle</h3>
                            <div id="score-semi-circle" class="text-lg font-bold">0</div>
                        </div>
                        <div class="score-item">
                            <h3 class="text-xs font-semibold uppercase tracking-wider" style="color: var(--text-secondary);">Almost Circle</h3>
                            <div id="score-almost-circle" class="text-lg font-bold">0</div>
                        </div>
                        <div class="score-item">
                            <h3 class="text-xs font-semibold uppercase tracking-wider" style="color: var(--text-secondary);">Sequence</h3>
                            <div id="score-sequence" class="text-lg font-bold">0</div>
                        </div>
                        <div class="score-item">
                            <h3 class="text-xs font-semibold uppercase tracking-wider" style="color: var(--text-secondary);">Line Master</h3>
                            <div id="score-line-master" class="text-lg font-bold">0</div>
                        </div>
                        <div class="score-item">
                            <h3 class="text-xs font-semibold uppercase tracking-wider" style="color: var(--text-secondary);">Diamond Heist</h3>
                            <div id="score-diamond-heist" class="text-lg font-bold text-red-600">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="game-over-modal" class="modal-overlay fixed inset-0 flex items-center justify-center p-4 z-50 hidden">
        <div class="modal-content w-full max-w-sm glass-card rounded-2xl p-8 text-center relative">
            <button id="close-modal-btn" class="absolute top-4 right-4 w-8 h-8 rounded-full text-xl flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200/50">×</button>
            <h2 class="text-2xl font-bold mb-4" style="color: var(--accent);">Game Over</h2>
            <p class="mb-6" style="color: var(--text-secondary);">You can no longer make a move.</p>
            <p class="text-sm" style="color: var(--text-secondary);">Final Score</p>
            <div id="final-score" class="text-6xl font-bold my-2" style="color: var(--accent);">0</div>
            <button id="restart-modal-btn" class="themed-button primary w-full py-2.5 px-4 text-white text-sm mt-4">Play Again</button>
        </div>
    </div>
    
    <div id="exchange-modal" class="modal-overlay fixed inset-0 flex items-center justify-center p-4 z-50 hidden">
        <div class="modal-content w-full max-w-md glass-card rounded-2xl p-6 text-center relative">
             <h2 class="text-xl font-bold mb-4" style="color: var(--accent);">Exchange Alo</h2>
             <div id="exchange-options" class="grid grid-cols-4 gap-2">
                 </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const DOMElements = {
                gameBoard: document.getElementById('game-board'),
                rollDiceBtn: document.getElementById('roll-dice-btn'),
                resetBtn: document.getElementById('reset-btn'),
                dice1El: document.getElementById('dice-1'),
                dice2El: document.getElementById('dice-2'),
                progressBarFill: document.getElementById('progress-bar-fill'),
                totalScore: document.getElementById('total-score'),
                highScore: document.getElementById('high-score'),
                scoreCircle: document.getElementById('score-circle'),
                scoreSemiCircle: document.getElementById('score-semi-circle'),
                scoreAlmostCircle: document.getElementById('score-almost-circle'),
                scoreSequence: document.getElementById('score-sequence'),
                scoreLineMaster: document.getElementById('score-line-master'),
                scoreDiamondHeist: document.getElementById('score-diamond-heist'),
                gameOverModal: document.getElementById('game-over-modal'),
                finalScore: document.getElementById('final-score'),
                restartModalBtn: document.getElementById('restart-modal-btn'),
                closeModalBtn: document.getElementById('close-modal-btn'),
                spCharge1: document.getElementById('sp-charge-1'),
                spCharge2: document.getElementById('sp-charge-2'),
                rotateBtn: document.getElementById('rotate-btn'),
                swapBtn: document.getElementById('swap-btn'),
                exchangeBtn: document.getElementById('exchange-btn'),
                moveBtn: document.getElementById('move-btn'),
                exchangeModal: document.getElementById('exchange-modal'),
                exchangeOptions: document.getElementById('exchange-options'),
            };
            
            const GRID_SIZE = 8;
            const SYMBOLS = ['navy', 'red', 'blue', 'grey'];
            const QUADRANTS = ['TL', 'TR', 'BL', 'BR'];
            const IMAGE_PATH = 'images/';
            const SUPERPOWERS = {
                ROTATE: 'rotate', SWAP: 'swap', EXCHANGE: 'exchange', MOVE: 'move'
            };

            let gridState = [], currentRoll = [], placementState = 'AWAITING_ROLL', firstPieceLocation = null, score = 0, highScore = 0;
            let lastClick = { time: 0, row: -1, col: -1 };
            let usedSuperpowers = new Set(), activeSuperpower = null, superpowerState = {};

            function init() {
                // Reset game state
                gridState = Array(GRID_SIZE * GRID_SIZE).fill(null);
                currentRoll = [];
                firstPieceLocation = null;
                placementState = 'AWAITING_ROLL';
                score = 0;
                highScore = localStorage.getItem('matchaloHighScore') || 0;
                
                // Reset superpower state
                usedSuperpowers = new Set();
                activeSuperpower = null;
                superpowerState = {};

                // Initialize UI
                DOMElements.gameBoard.innerHTML = '';
                for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell empty relative';
                    cell.dataset.index = i;
                    const row = Math.floor(i / GRID_SIZE), col = i % GRID_SIZE;
                    cell.dataset.row = row; cell.dataset.col = col;
                    cell.addEventListener('click', () => onCellClick(row, col));
                    DOMElements.gameBoard.appendChild(cell);
                }
                
                calculateTotalScore();
                updateProgressBar();
                updateDiceDisplay();
                updateSuperpowerUI();
                DOMElements.gameOverModal.classList.add('hidden');
                DOMElements.rollDiceBtn.disabled = false;
            }

            // --- Event Handling ---
            function onCellClick(row, col) {
                const now = new Date().getTime();
                if (now - lastClick.time < 300 && lastClick.row === row && lastClick.col === col) {
                    handleDoubleClick(row, col);
                    lastClick = { time: 0, row: -1, col: -1 }; return;
                }
                lastClick = { time: now, row, col };

                if (activeSuperpower) {
                    handleSuperpowerClick(row, col);
                } else {
                    handlePlacementClick(row, col);
                }
            }

            function handleDoubleClick(row, col) {
                if (placementState === 'AWAITING_SECOND_PLACEMENT' && firstPieceLocation.row === row && firstPieceLocation.col === col) {
                    const index = row * GRID_SIZE + col;
                    gridState[index] = null;
                    renderCell(row, col);
                    firstPieceLocation = null;
                    placementState = 'AWAITING_FIRST_PLACEMENT';
                }
            }

            function handlePlacementClick(row, col) {
                const index = row * GRID_SIZE + col;
                if (placementState === 'AWAITING_FIRST_PLACEMENT' && !gridState[index]) {
                    placePiece(row, col, 0);
                    firstPieceLocation = { row, col };
                    placementState = 'AWAITING_SECOND_PLACEMENT';
                } else if (placementState === 'AWAITING_SECOND_PLACEMENT') {
                    const isAdjacent = Math.abs(firstPieceLocation.row - row) + Math.abs(firstPieceLocation.col - col) === 1;
                    if (isAdjacent && !gridState[index]) {
                        placePiece(row, col, 1);
                        endTurn();
                    }
                }
            }
            
            // --- Game Flow ---
            function endTurn() {
                firstPieceLocation = null;
                placementState = 'AWAITING_ROLL';
                currentRoll = [];
                DOMElements.rollDiceBtn.disabled = false;
                
                calculateTotalScore();
                updateProgressBar();
                updateDiceDisplay();
                updateSuperpowerUI();

                if (isGameOver()) showGameOver();
            }

            function handleRollDice() {
                if (activeSuperpower) cancelSuperpower();
                if (placementState !== 'AWAITING_ROLL') return;
                
                DOMElements.rollDiceBtn.disabled = true;
                DOMElements.dice1El.classList.add('dice-tumble');
                DOMElements.dice2El.classList.add('dice-tumble');
                
                setTimeout(() => {
                    const piece1 = generateRandomAlo();
                    let piece2 = generateRandomAlo();
                    while (piece2.quadrant === piece1.quadrant) {
                        piece2 = generateRandomAlo();
                    }
                    currentRoll = [piece1, piece2];
                    placementState = 'AWAITING_FIRST_PLACEMENT';
                    updateDiceDisplay();
                    updateSuperpowerUI();
                    DOMElements.dice1El.classList.remove('dice-tumble');
                    DOMElements.dice2El.classList.remove('dice-tumble');
                }, 600);
            }
            
            // --- Superpower Logic ---
            function activateSuperpower(powerName) {
                if (placementState !== 'AWAITING_ROLL' || usedSuperpowers.size >= 2 || usedSuperpowers.has(powerName)) {
                    return;
                }
                
                if (activeSuperpower === powerName) {
                    cancelSuperpower();
                } else {
                    activeSuperpower = powerName;
                    superpowerState = {}; // Reset state for new power
                    updateSuperpowerUI();
                }
            }
            
            function cancelSuperpower() {
                activeSuperpower = null;
                superpowerState = {};
                document.querySelectorAll('.pulsing-cell').forEach(c => c.classList.remove('pulsing-cell'));
                updateSuperpowerUI();
            }
            
            function consumeSuperpower(powerName) {
                usedSuperpowers.add(powerName);
                cancelSuperpower();
                calculateTotalScore();
                updateSuperpowerUI();
            }

            function handleSuperpowerClick(row, col) {
                const index = row * GRID_SIZE + col;
                const piece = gridState[index];
                
                switch (activeSuperpower) {
                    case SUPERPOWERS.ROTATE:
                        if (!piece) return;
                        const quadrantOrder = ['TL', 'TR', 'BR', 'BL'];
                        const currentIdx = quadrantOrder.indexOf(piece.quadrant);
                        const nextIdx = (currentIdx + 1) % 4;
                        piece.quadrant = quadrantOrder[nextIdx];
                        renderCell(row, col);
                        consumeSuperpower(SUPERPOWERS.ROTATE);
                        break;
                    
                    case SUPERPOWERS.MOVE:
                        if (!superpowerState.source) {
                            if (!piece) return;
                            superpowerState.source = { row, col };
                            DOMElements.gameBoard.querySelector(`[data-index='${index}']`).classList.add('pulsing-cell');
                        } else {
                            if (piece) return; // Destination must be empty
                            const sourceIndex = superpowerState.source.row * GRID_SIZE + superpowerState.source.col;
                            gridState[index] = gridState[sourceIndex];
                            gridState[sourceIndex] = null;
                            renderCell(superpowerState.source.row, superpowerState.source.col);
                            renderCell(row, col);
                            consumeSuperpower(SUPERPOWERS.MOVE);
                        }
                        break;
                        
                    case SUPERPOWERS.SWAP:
                        if (!superpowerState.source) {
                            if (!piece) return;
                            superpowerState.source = { row, col };
                            DOMElements.gameBoard.querySelector(`[data-index='${index}']`).classList.add('pulsing-cell');
                        } else {
                            if (!piece) return;
                            const isAdjacent = Math.abs(superpowerState.source.row - row) + Math.abs(superpowerState.source.col - col) === 1;
                            if (!isAdjacent) return;

                            const sourceIndex = superpowerState.source.row * GRID_SIZE + superpowerState.source.col;
                            const temp = gridState[sourceIndex];
                            gridState[sourceIndex] = gridState[index];
                            gridState[index] = temp;
                            renderCell(superpowerState.source.row, superpowerState.source.col);
                            renderCell(row, col);
                            consumeSuperpower(SUPERPOWERS.SWAP);
                        }
                        break;
                    
                    case SUPERPOWERS.EXCHANGE:
                        if (!piece) return;
                        superpowerState.source = { row, col };
                        DOMElements.exchangeOptions.innerHTML = '';
                        const allAlos = SYMBOLS.flatMap(s => QUADRANTS.map(q => ({ symbol: s, quadrant: q })));
                        
                        allAlos.forEach(alo => {
                            const option = document.createElement('div');
                            option.className = 'w-16 h-16 bg-white/50 rounded-lg p-1 cursor-pointer hover:bg-white/90';
                            const img = document.createElement('img');
                            img.src = `${IMAGE_PATH}${alo.symbol}_${alo.quadrant}.svg`;
                            option.appendChild(img);
                            
                            if (alo.symbol === piece.symbol && alo.quadrant === piece.quadrant) {
                                option.classList.add('opacity-30', 'cursor-not-allowed');
                            } else {
                                option.addEventListener('click', () => {
                                    const sourceIndex = superpowerState.source.row * GRID_SIZE + superpowerState.source.col;
                                    gridState[sourceIndex] = alo;
                                    renderCell(superpowerState.source.row, superpowerState.source.col);
                                    DOMElements.exchangeModal.classList.add('hidden');
                                    consumeSuperpower(SUPERPOWERS.EXCHANGE);
                                });
                            }
                            DOMElements.exchangeOptions.appendChild(option);
                        });
                        DOMElements.exchangeModal.classList.remove('hidden');
                        break;
                }
            }

            // --- Scoring Engine ---
            function calculateTotalScore() {
                let scoreBreakdown = { circle: 0, semiCircle: 0, almostCircle: 0, sequence: 0, lineMaster: 0, diamondHeist: 0 };
                // ... (Full, complex scoring logic from previous turn)
                 const visited = Array(GRID_SIZE * GRID_SIZE).fill(false);

                // Circle, Semi-circle, Almost-circle, Diamond Heist logic
                for (let r = 0; r < GRID_SIZE - 1; r++) {
                    for (let c = 0; c < GRID_SIZE - 1; c++) {
                        const tl = gridState[r * GRID_SIZE + c], tr = gridState[r * GRID_SIZE + c + 1], bl = gridState[(r + 1) * GRID_SIZE + c], br = gridState[(r + 1) * GRID_SIZE + c + 1];
                        const pieces = [tl, tr, bl, br].filter(Boolean);
                        const quadrants = new Set(pieces.map(p => p.quadrant));
                        const symbols = pieces.map(p => p.symbol);
                        
                        if (pieces.length < 2) continue;
                        if (pieces.length === 4) {
                            if (quadrants.has('TL') && quadrants.has('TR') && quadrants.has('BL') && quadrants.has('BR')) {
                                if(tl.quadrant === 'TL' && tr.quadrant === 'TR' && bl.quadrant === 'BL' && br.quadrant === 'BR')
                                    scoreBreakdown.circle += (new Set(symbols).size === 1) ? 40 : 20;
                                else if (tl.quadrant === 'BR' && tr.quadrant === 'BL' && bl.quadrant === 'TR' && br.quadrant === 'TL')
                                    scoreBreakdown.diamondHeist -= 10;
                            }
                        } else if (pieces.length === 3) {
                            const validSets = [ new Set(['TL', 'TR', 'BL']), new Set(['TL', 'TR', 'BR']), new Set(['TL', 'BL', 'BR']), new Set(['TR', 'BL', 'BR'])];
                            let isValidAlmostCircle = false;
                            for (const validSet of validSets) {
                                if (validSet.size === quadrants.size && [...validSet].every(q => quadrants.has(q))) {
                                    isValidAlmostCircle = true; break;
                                }
                            }
                            if (isValidAlmostCircle) scoreBreakdown.almostCircle += (new Set(symbols).size === 1 ? 20 : 15);
                        } else if (pieces.length === 2) {
                            const q1 = pieces[0].quadrant, q2 = pieces[1].quadrant;
                            const isHorizontalPair = (q1 === 'TL' && q2 === 'TR') || (q1 === 'TR' && q2 === 'TL') || (q1 === 'BL' && q2 === 'BR') || (q1 === 'BR' && q2 === 'BL');
                            const isVerticalPair = (q1 === 'TL' && q2 === 'BL') || (q1 === 'BL' && q2 === 'TL') || (q1 === 'TR' && q2 === 'BR') || (q1 === 'BR' && q2 === 'TR');
                            if (isHorizontalPair || isVerticalPair) scoreBreakdown.semiCircle += (pieces[0].symbol === pieces[1].symbol ? 10 : 5);
                        }
                    }
                }

                // Sequence logic
                for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) { if (gridState[i] && !visited[i]) { const blob = []; const queue = [i]; visited[i] = true; const symbol = gridState[i].symbol; while (queue.length > 0) { const currentIdx = queue.shift(); blob.push(currentIdx); const r = Math.floor(currentIdx / GRID_SIZE), c = currentIdx % GRID_SIZE; [[r-1,c], [r+1,c], [r,c-1], [r,c+1]].forEach(([nr, nc]) => { const neighborIdx = nr * GRID_SIZE + nc; if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && gridState[neighborIdx]?.symbol === symbol && !visited[neighborIdx]) { visited[neighborIdx] = true; queue.push(neighborIdx); } }); } if (blob.length > 1) scoreBreakdown.sequence += blob.length; } }
                
                // Line Master logic
                for (let r = 0; r < GRID_SIZE; r++) { const firstPiece = gridState[r * GRID_SIZE]; if (firstPiece && gridState.slice(r * GRID_SIZE, (r + 1) * GRID_SIZE).every(p => p?.symbol === firstPiece.symbol)) scoreBreakdown.lineMaster += 10; }
                for (let c = 0; c < GRID_SIZE; c++) { const firstPiece = gridState[c]; if (firstPiece) { let isLineMaster = true; for (let r = 1; r < GRID_SIZE; r++) { if (gridState[r * GRID_SIZE + c]?.symbol !== firstPiece.symbol) { isLineMaster = false; break; } } if (isLineMaster) scoreBreakdown.lineMaster += 10; } }

                score = Object.values(scoreBreakdown).reduce((a, b) => a + b, 0);
                updateScoreUI(scoreBreakdown);
            }
            
            // --- UI Update Functions ---
            function updateScoreUI(breakdown) {
                DOMElements.totalScore.textContent = score;
                DOMElements.scoreCircle.textContent = breakdown.circle;
                DOMElements.scoreSemiCircle.textContent = breakdown.semiCircle;
                DOMElements.scoreAlmostCircle.textContent = breakdown.almostCircle;
                DOMElements.scoreSequence.textContent = breakdown.sequence;
                DOMElements.scoreLineMaster.textContent = breakdown.lineMaster;
                DOMElements.scoreDiamondHeist.textContent = breakdown.diamondHeist;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('matchaloHighScore', highScore);
                }
                DOMElements.highScore.textContent = highScore;
            }

            function updateSuperpowerUI() {
                const canUsePower = placementState === 'AWAITING_ROLL' && usedSuperpowers.size < 2;
                
                [DOMElements.rotateBtn, DOMElements.swapBtn, DOMElements.exchangeBtn, DOMElements.moveBtn].forEach(btn => {
                    const powerName = btn.id.replace('-btn', '');
                    const isUsed = usedSuperpowers.has(powerName);
                    btn.disabled = !canUsePower || isUsed;
                    btn.classList.toggle('opacity-50', !canUsePower || isUsed);
                    btn.classList.toggle('cursor-not-allowed', !canUsePower || isUsed);
                    btn.querySelector('.superpower-used-overlay').classList.toggle('hidden', !isUsed);
                    btn.classList.toggle('superpower-btn--active', activeSuperpower === powerName);
                });
                
                DOMElements.spCharge1.classList.toggle('opacity-30', usedSuperpowers.size >= 1);
                DOMElements.spCharge2.classList.toggle('opacity-30', usedSuperpowers.size >= 2);
            }

            // --- Utility Functions (unchanged from previous version) ---
            function placePiece(row, col, rollIndex) { gridState[row * GRID_SIZE + col] = currentRoll[rollIndex]; renderCell(row, col); }
            function renderCell(row, col) { const index = row * GRID_SIZE + col, cell = DOMElements.gameBoard.querySelector(`[data-index='${index}']`), piece = gridState[index]; cell.innerHTML = ''; if (piece) { cell.classList.remove('empty'); const img = document.createElement('img'); img.src = `${IMAGE_PATH}${piece.symbol}_${piece.quadrant}.svg`; cell.appendChild(img); } else { cell.classList.add('empty'); } }
            function generateRandomAlo() { const symbol = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)], quadrant = QUADRANTS[Math.floor(Math.random() * QUADRANTS.length)]; return { symbol, quadrant }; }
            function isGameOver() { if (!gridState.includes(null)) return true; for (let r = 0; r < GRID_SIZE; r++) { for (let c = 0; c < GRID_SIZE; c++) { const idx = r * GRID_SIZE + c; if (!gridState[idx]) { if ((c < GRID_SIZE - 1 && !gridState[idx + 1]) || (r < GRID_SIZE - 1 && !gridState[idx + GRID_SIZE])) return false; } } } return true; }
            function showGameOver() { DOMElements.finalScore.textContent = score; DOMElements.gameOverModal.classList.remove('hidden'); DOMElements.rollDiceBtn.disabled = true; DOMElements.gameBoard.querySelectorAll('.grid-cell.empty').forEach(cell => cell.classList.remove('empty')); }
            function updateProgressBar() { const filledCells = gridState.filter(cell => cell !== null).length; DOMElements.progressBarFill.style.width = `${(filledCells / (GRID_SIZE * GRID_SIZE)) * 100}%`; }
            function updateDiceDisplay() { [DOMElements.dice1El, DOMElements.dice2El].forEach((el, i) => { el.innerHTML = ''; if (currentRoll[i]) { const piece = currentRoll[i], img = document.createElement('img'); img.src = `${IMAGE_PATH}${piece.symbol.toLowerCase()}_${piece.quadrant}.svg`; el.appendChild(img); } else { el.textContent = '?'; } }); }

            // --- Initial Setup of Event Listeners ---
            DOMElements.rollDiceBtn.addEventListener('click', handleRollDice);
            DOMElements.resetBtn.addEventListener('click', init);
            DOMElements.restartModalBtn.addEventListener('click', init);
            DOMElements.closeModalBtn.addEventListener('click', () => DOMElements.gameOverModal.classList.add('hidden'));
            DOMElements.rotateBtn.addEventListener('click', () => activateSuperpower(SUPERPOWERS.ROTATE));
            DOMElements.swapBtn.addEventListener('click', () => activateSuperpower(SUPERPOWERS.SWAP));
            DOMElements.exchangeBtn.addEventListener('click', () => activateSuperpower(SUPERPOWERS.EXCHANGE));
            DOMElements.moveBtn.addEventListener('click', () => activateSuperpower(SUPERPOWERS.MOVE));
            
            init();
        });
    </script>
</body>
